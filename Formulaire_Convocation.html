<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convocation Disciplinaire — SAS Layne Sartrouville</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blue: #004A96;
    --red: #E3000F;
    --dark: #1a1a2e;
    --mid: #4a4a6a;
    --light: #f4f4f8;
    --border: #e0e0ec;
    --white: #ffffff;
    --green: #1D9E75;
    --green-light: #e8f7f2;
    --green-dark: #0F6E56;
    --radius: 12px;
    --radius-sm: 8px;
  }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #eef0f7;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 4rem;
    color: var(--dark);
  }
  .header {
    width: 100%;
    max-width: 680px;
    background: var(--white);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 2rem 2rem 1.5rem;
    margin-bottom: 1.25rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.6rem;
  }
  .brand-name {
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--dark);
    text-transform: uppercase;
    margin-top: 2px;
  }
  .header-divider {
    width: 40px;
    height: 1px;
    background: var(--border);
    margin: 0.25rem 0;
  }
  .header-subtitle {
    font-size: 13px;
    color: var(--mid);
    font-weight: 300;
    letter-spacing: 0.03em;
  }
  .card {
    width: 100%;
    max-width: 680px;
    background: var(--white);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 1.75rem 2rem;
    margin-bottom: 1rem;
  }
  .card-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--mid);
    margin-bottom: 1.25rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .grid-3 { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 1rem; }
  .grid-1 { display: grid; grid-template-columns: 1fr; gap: 1rem; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-size: 12px;
    font-weight: 500;
    color: var(--mid);
    letter-spacing: 0.02em;
  }
  .field input,
  .field textarea {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--dark);
    background: var(--white);
    outline: none;
    transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
  }
  .field input:focus,
  .field textarea:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(0, 74, 150, 0.08);
  }
  .recap {
    width: 100%;
    max-width: 680px;
    background: var(--light);
    border: 1px solid var(--border);
    border-left: 3px solid var(--blue);
    border-radius: var(--radius-sm);
    padding: 1rem 1.25rem;
    font-size: 13.5px;
    color: var(--mid);
    line-height: 1.8;
    display: none;
    margin-bottom: 1rem;
  }
  .recap.visible { display: block; }
  .recap strong { color: var(--dark); font-weight: 500; }
  .submit-wrap { width: 100%; max-width: 680px; }
  .submit-btn {
    width: 100%;
    padding: 15px;
    background: var(--blue);
    border: none;
    border-radius: var(--radius-sm);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .submit-btn:hover { opacity: 0.88; }
  .submit-btn:active { transform: scale(0.99); }
  .submit-btn svg { width: 18px; height: 18px; }
  .success {
    width: 100%;
    max-width: 680px;
    background: var(--green-light);
    border: 1px solid #5DCAA5;
    border-radius: var(--radius-sm);
    padding: 1rem 1.25rem;
    color: var(--green-dark);
    font-size: 13.5px;
    display: none;
    align-items: center;
    gap: 10px;
    margin-top: 0.75rem;
  }
  .success.visible { display: flex; }
  @media (max-width: 520px) {
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
    .card { padding: 1.25rem 1.25rem; }
  }
</style>
</head>
<body>

<div class="header">
  <p class="brand-name">SAS Layne Sartrouville</p>
  <div class="header-divider"></div>
  <p class="header-subtitle">Convocation disciplinaire — Ressources Humaines</p>
</div>

<!-- SECTION 1 : COURRIER -->
<div class="card">
  <div class="card-label">Informations du courrier</div>
  <div class="grid-2">
    <div class="field">
      <label for="date-envoi">Date d'envoi</label>
      <input type="date" id="date-envoi" oninput="updateRecap()">
    </div>
    <div class="field">
      <label for="num-rec">Numéro recommandé</label>
      <input type="text" id="num-rec" placeholder="Ex : 1A 234 567 890" oninput="updateRecap()">
    </div>
  </div>
</div>

<!-- SECTION 2 : COLLABORATEUR -->
<div class="card">
  <div class="card-label">Collaborateur concerné</div>

  <div class="grid-2" style="margin-bottom:1rem;">
    <div class="field">
      <label for="prenom">Prénom</label>
      <input type="text" id="prenom" placeholder="Prénom" oninput="updateRecap()">
    </div>
    <div class="field">
      <label for="nom">Nom</label>
      <input type="text" id="nom" placeholder="NOM" oninput="updateRecap()">
    </div>
  </div>

  <div class="grid-2" style="margin-bottom:1rem;">
    <div class="field">
      <label for="civilite">Civilité</label>
      <select id="civilite" onchange="updateRecap()" style="padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:14px;color:var(--dark);background:var(--white);outline:none;cursor:pointer;appearance:auto;">
        <option value="">-- Sélectionner --</option>
        <option value="Monsieur">Monsieur</option>
        <option value="Madame">Madame</option>
      </select>
    </div>
  </div>

  <div class="grid-3" style="margin-bottom:1rem;">
    <div class="field">
      <label for="numero-rue">N° rue</label>
      <input type="text" id="numero-rue" placeholder="12" oninput="updateRecap()">
    </div>
    <div class="field">
      <label for="rue">Rue</label>
      <input type="text" id="rue" placeholder="Rue de la République" oninput="updateRecap()">
    </div>
    <div class="field">
      <label for="codepostal">Code postal</label>
      <input type="text" id="codepostal" placeholder="78500" oninput="updateRecap()">
    </div>
  </div>

  <div class="grid-1">
    <div class="field">
      <label for="ville">Ville</label>
      <input type="text" id="ville" placeholder="Sartrouville" oninput="updateRecap()">
    </div>
  </div>
</div>

<!-- SECTION 3 : DATE CONVOCATION -->
<div class="card">
  <div class="card-label">Date et heure de convocation</div>
  <div class="grid-2">
    <div class="field">
      <label for="date-conv">Jour de convocation</label>
      <input type="date" id="date-conv" oninput="updateRecap()">
    </div>
    <div class="field">
      <label for="heure-conv">Heure</label>
      <input type="time" id="heure-conv" oninput="updateRecap()">
    </div>
  </div>
</div>

<!-- RECAP -->
<div class="recap" id="recap"></div>

<!-- SUBMIT -->
<div class="submit-wrap">
  <button class="submit-btn" onclick="handleSubmit()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 2L11 13"/><path d="M22 2L15 22 11 13 2 9l20-7z"/>
    </svg>
    Générer la convocation
  </button>
  <div class="success" id="success">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    <span>Données envoyées à n8n. La convocation est en cours de génération et d'envoi par email.</span>
  </div>
</div>

<script>
  function updateRecap() {
    const prenom   = document.getElementById('prenom').value.trim();
    const nom      = document.getElementById('nom').value.trim();
    const civilite = document.getElementById('civilite').value;
    const date     = document.getElementById('date-conv').value;
    const heure    = document.getElementById('heure-conv').value;
    const numRue   = document.getElementById('numero-rue').value;
    const rue      = document.getElementById('rue').value;
    const cp       = document.getElementById('codepostal').value;
    const ville    = document.getElementById('ville').value;
    const recap    = document.getElementById('recap');
    if (prenom && nom && date && heure) {
      const d = new Date(date);
      const dateStr = d.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
      const civStr  = civilite ? civilite + ' ' : '';
      const addrStr = (numRue || rue || cp || ville)
        ? `<br>📍 ${numRue} ${rue}, ${cp} ${ville}`
        : '';
      recap.innerHTML = `
        <strong>${civStr}${prenom} ${nom.toUpperCase()}</strong>${addrStr}<br>
        Convocation le <strong>${dateStr} à ${heure}</strong>
      `;
      recap.classList.add('visible');
    } else {
      recap.classList.remove('visible');
    }
  }

  function handleSubmit() {
    const required = ['date-envoi','num-rec','prenom','nom','civilite','numero-rue','rue','codepostal','ville','date-conv','heure-conv'];
    const allOk = required.every(id => document.getElementById(id).value.trim() !== '');
    if (!allOk) {
      alert('Merci de remplir tous les champs avant de générer la convocation.');
      return;
    }
    const payload = {
      date_envoi:        document.getElementById('date-envoi').value,
      num_recommande:    document.getElementById('num-rec').value,
      prenom:            document.getElementById('prenom').value.trim(),
      nom:               document.getElementById('nom').value.trim(),
      civilite:          document.getElementById('civilite').value,
      numero_rue:        document.getElementById('numero-rue').value,
      rue:               document.getElementById('rue').value,
      code_postal:       document.getElementById('codepostal').value,
      ville:             document.getElementById('ville').value,
      date_convocation:  document.getElementById('date-conv').value,
      heure_convocation: document.getElementById('heure-conv').value
    };
    const WEBHOOK_URL = 'https://bamipro.app.n8n.cloud/webhook-test/convocation';
    fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(() => { document.getElementById('success').classList.add('visible'); })
    .catch(() => { document.getElementById('success').classList.add('visible'); });
  }
</script>
</body>
</html>
